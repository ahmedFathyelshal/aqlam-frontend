<ng-container *transloco="let tr">
  <header class="mb-5">
    <p class="text-sm font-bold text-primary-600">{{ tr('cb.step', { n: 3 }) }}</p>
    <h1 class="page-title">{{ tr('cb.s3.title') }}</h1>
    <p class="page-subtitle">{{ tr('cb.s3.intro') }}</p>
  </header>

  <form class="flex flex-col gap-4" (submit)="onNext($event)" novalidate>
    <label class="field">
      <span class="field-label">{{ tr('cb.s3.subtitle') }} <span class="text-danger-700" aria-hidden="true">*</span></span>
      <textarea class="textarea" rows="3" [formField]="mediaForm.subtitle" [placeholder]="tr('cb.s3.subtitlePlaceholder')"></textarea>
      <span class="flex justify-between gap-2">
        <span class="field-error">{{ mediaForm.subtitle().touched() && mediaForm.subtitle().errors().length ? mediaForm.subtitle().errors()[0].message : '' }}</span>
        <span class="text-sm" [class]="mediaForm.subtitle().value().length > 250 ? 'text-danger-700' : 'text-muted'" dir="ltr">{{ mediaForm.subtitle().value().length }} / 250</span>
      </span>
    </label>

    <div class="field">
      <span class="field-label">{{ tr('cb.s3.thumbnail') }} <span class="text-danger-700" aria-hidden="true">*</span></span>
      <label class="relative flex aspect-video max-w-md cursor-pointer flex-col items-center justify-center gap-2 overflow-hidden rounded-[6px] border-2 border-dashed border-field bg-page text-center text-muted hover:border-primary-600">
        <input type="file" accept="image/jpeg, image/png" class="sr-only" (change)="onFileSelected($event)" />
        @if (previewUrl()) {
          <img [src]="previewUrl()" alt="" class="absolute inset-0 size-full object-cover" />
          <span class="absolute bottom-2 start-2 inline-flex items-center gap-1 rounded-[6px] bg-white/95 px-2.5 py-1 text-sm font-bold text-ink"><mat-icon svgIcon="pencil" class="icon-size-4" />{{ tr('cb.s3.change') }}</span>
        } @else {
          <mat-icon svgIcon="cloud-upload" class="icon-size-8" />
          <span class="font-bold text-ink">{{ tr('cb.s3.upload') }}</span>
          <span class="text-sm">{{ tr('cb.s3.uploadHint') }}</span>
        }
      </label>
      @if (thumbnailError()) { <span class="field-error">{{ thumbnailError() }}</span> }
    </div>

    <label class="field">
      <span class="field-label">{{ tr('cb.s3.promo') }}</span>
      <input type="url" class="input" dir="ltr" inputmode="url" [formField]="mediaForm.promoVideoUrl" placeholder="https://www.youtube.com/watch?v=…" />
      @if (mediaForm.promoVideoUrl().touched() && mediaForm.promoVideoUrl().errors().length) { <span class="field-error">{{ mediaForm.promoVideoUrl().errors()[0].message }}</span> }
    </label>

    <div class="mt-2 flex flex-wrap justify-between gap-2 border-t border-line-soft pt-4">
      <button type="button" class="btn btn-ghost" (click)="goBack()">{{ tr('cb.back') }}</button>
      <button type="submit" class="btn btn-primary min-w-36" [disabled]="isSubmitting()">{{ tr('cb.continue') }}<mat-icon svgIcon="chevron-left" class="icon-size-5 ltr:rotate-180" /></button>
    </div>
  </form>
</ng-container>
